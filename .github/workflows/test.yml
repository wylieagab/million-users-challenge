name: C# isolated AOT and UTF-8 comparison

on:
  pull_request:
    branches: [csharp-kestrel-wylieagab]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGCLIENTENCODING: UTF8
      JWT_SECRET: million-users-challenge
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install harness prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq curl openssl
          node --version
          python3 --version
      - name: Match the upstream CI connection limit
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql -qX -v ON_ERROR_STOP=1 -d postgres -c "ALTER SYSTEM SET max_connections = 600"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if pg_isready -q; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build the unchanged deterministic seed
        run: bash seed/make-seed.sh
      - name: Install the submission's checksum-pinned SDK
        run: sudo bash submissions/csharp-kestrel-wylieagab/install.sh
      - name: Validate and compare four isolated variants
        timeout-minutes: 20
        env:
          PERF_RESULTS: ${{ runner.temp }}/csharp-perf-results
        run: python3 _perf/run-comparison.py
      - name: Preserve logs, manifests, and raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-four-variant-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/csharp-perf-results
          if-no-files-found: warn
          retention-days: 14
