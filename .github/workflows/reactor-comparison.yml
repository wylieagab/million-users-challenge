name: C# reactor comparison (diagnostic)
on:
  pull_request:
    paths:
      - 'submissions/csharp-epoll-wylieagab/**'
      - 'experiments/reactor-comparison/**'
      - '.github/workflows/reactor-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reactor-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    if: github.repository_owner == 'wylieagab'
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      replicas: ${{ steps.mode.outputs.replicas }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: mode
        name: Select smoke or replicated comparison
        run: |
          mode="$(tr -d '\r\n' < experiments/reactor-comparison/mode.txt)"
          case "$mode" in
            smoke) replicas='[0]' ;;
            full|capacity) replicas='[0,1,2]' ;;
            *) printf 'Unknown comparison mode: %s\n' "$mode" >&2; exit 2 ;;
          esac
          printf 'mode=%s\nreplicas=%s\n' "$mode" "$replicas" >> "$GITHUB_OUTPUT"
  compare:
    name: compare (replica ${{ matrix.replica }})
    needs: configure
    if: github.repository_owner == 'wylieagab'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        replica: ${{ fromJSON(needs.configure.outputs.replicas) }}
    services:
      postgres:
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --shm-size=2g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGCLIENTENCODING: UTF8
      JWT_SECRET: million-users-challenge
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      REPLICA_INDEX: ${{ matrix.replica }}
      COMPARISON_MODE: ${{ needs.configure.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check measurement and scheduling invariants
        run: python3 experiments/reactor-comparison/test_driver.py
      - name: Verify pinned submission installer
        run: sudo bash submissions/csharp-epoll-wylieagab/install.sh
      - name: Prepare pinned tools, database settings, and unchanged seed
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash experiments/reactor-comparison/prepare.sh
      - name: Correctness and controlled mixed workload
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          printf 'Inherited NOFILE: soft=%s hard=%s\n' "$(ulimit -Sn)" "$(ulimit -Hn)"
          sudo -n prlimit --pid "$$" --nofile=1048576:1048576
          printf 'Trial NOFILE: soft=%s hard=%s\n' "$(ulimit -Sn)" "$(ulimit -Hn)"
          exec python3 -u experiments/reactor-comparison/run.py \
            --allow-disposable-database \
            --mode "$COMPARISON_MODE" --rounds 1 --replicate-index "$REPLICA_INDEX" \
            --output "$GITHUB_WORKSPACE/reactor-results"
      - name: Preserve raw evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-comparison-${{ github.run_id }}-${{ github.run_attempt }}-replica-${{ matrix.replica }}
          path: reactor-results/
          if-no-files-found: warn
          retention-days: 30
